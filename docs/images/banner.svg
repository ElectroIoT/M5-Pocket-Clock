<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="M5 Pocket Clock">
  <rect width="1280" height="320" rx="24" fill="#0c0c18"/>
  <text x="56" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#f1f4ff">Pocket Clock</text>
  <text x="58" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#8c98b8">A 12-hour clock that sets itself - Wi-Fi once, then forget it.</text>
  <text x="58" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#50c8ff">M5Stack AtomS3  &#183;  AM/PM  &#183;  date  &#183;  auto timezone  &#183;  3 faces</text>
  <g transform="translate(800 36)">
    <rect x="0" y="0" width="248" height="248" rx="20" fill="#050810" stroke="#28304a" stroke-width="4"/>
    <text x="124" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#78849f">WED 18 NOV</text>
    <text x="124" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="84" font-weight="800" fill="#f0f4ff">10<tspan fill="#50c8ff">:</tspan>45</text>
    <text x="96" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#50c8ff">AM</text>
    <text x="176" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#78849f">:18</text>
    <circle cx="70" cy="222" r="6" fill="#3cdc78"/>
    <text x="86" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#78849f">UTC+5:30</text>
  </g>
  <g transform="translate(1080 36)">
    <circle cx="90" cy="124" r="86" fill="#050810" stroke="#28304a" stroke-width="12"/>
    <path d="M90 38 A86 86 0 1 1 30 62" fill="none" stroke="#50c8ff" stroke-width="12" stroke-linecap="round"/>
    <text x="90" y="124" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#f0f4ff">10:45</text>
    <text x="90" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#50c8ff">AM</text>
  </g>
</svg>
