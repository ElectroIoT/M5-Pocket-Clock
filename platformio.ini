; M5 Pocket Clock - 12-hour desk clock for AtomS3 and M5StickC.
;   pio run -e atoms3 -t upload        (or)        pio run -e m5stickc -t upload
[platformio]
default_envs = atoms3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.2.2
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0

[env:atoms3]
board = m5stack-atoms3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:m5stickc]
board = m5stick-c
board_build.partitions = no_ota.csv
